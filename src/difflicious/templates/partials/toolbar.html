<!-- Toolbar -->
<header x-data="toolbarComponent()" class="app-toolbar">
    <div class="flex items-center justify-between w-full">
        <div class="flex items-center gap-5 flex-1 min-w-0">
            <h1 class="m-0">
                <a href="/" class="app-wordmark">Difflicious</a>
            </h1>

            <!-- Base Branch Dropdown -->
            <form method="GET" action="/" class="flex items-center gap-2 flex-1 min-w-0"
                @submit="scrubEmptySearch($el)"
                id="diff-toolbar-form">
                <label class="control-toggle-icon flex items-center">
                    <svg width="16" height="16" viewBox="0 0 512 512" fill="currentColor" class="inline" title="Branch"
                        aria-label="Select base branch">
                        <path
                            d="M416 160c0-35.3-28.7-64-64-64s-64 28.7-64 64c0 23.7 12.9 44.3 32 55.4v8.6c0 19.9-7.8 33.7-25.3 44.9-15.4 9.8-38.1 17.1-67.5 21.5-14 2.1-25.7 6-35.2 10.7V151.4c19.1-11.1 32-31.7 32-55.4 0-35.3-28.7-64-64-64S96 60.7 96 96c0 23.7 12.9 44.3 32 55.4v209.2c-19.1 11.1-32 31.7-32 55.4 0 35.3 28.7 64 64 64s64-28.7 64-64c0-16.6-6.3-31.7-16.7-43.1 1.9-4.9 9.7-16.3 29.4-19.3 38.8-5.8 68.9-15.9 92.3-30.8 36-22.8 55-57 55-98.8v-8.6c19.1-11.1 32-31.7 32-55.4zM160 56c22.1 0 40 17.9 40 40s-17.9 40-40 40-40-17.9-40-40 17.9-40 40-40zm0 400c-22.1 0-40-17.9-40-40s17.9-40 40-40 40 17.9 40 40-17.9 40-40 40zm192-256c-22.1 0-40-17.9-40-40s17.9-40 40-40 40 17.9 40 40-17.9 40-40 40z" />
                    </svg>
                </label>
                <select name="base_ref" onchange="this.form.submit()" class="control control-select">
                    {% for branch in branches.all %}
                    <option value="{{ branch }}" {% if branch==current_base_ref %}selected{% endif %}>
                        {{ branch }}
                    </option>
                    {% endfor %}
                </select>

                <!-- Current file: jump to any file, and follow the pinned header.
                     Icon and select share one condition: hiding the select alone
                     leaves its label behind, an icon labelling nothing. -->
                <div class="flex items-center gap-2"
                    x-show="$store.nav.files.length > 1"
                    x-cloak>
                    <label class="control-toggle-icon flex items-center" for="file-jump">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            title="File" aria-label="Jump to file">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <path d="M14 2v6h6" />
                        </svg>
                    </label>
                    <select id="file-jump" class="control control-select"
                        aria-label="Jump to file"
                        x-model="$store.nav.currentFile"
                        @change="$store.nav.jumpToFile($event.target.value)">
                        <template x-for="group in $store.nav.fileGroups" :key="group.label">
                            <optgroup :label="group.label || 'Files'">
                                <template x-for="file in group.files" :key="file.id">
                                    <option :value="file.id" x-text="file.label"></option>
                                </template>
                            </optgroup>
                        </template>
                    </select>
                </div>

                <!-- Jump to either end of the diff -->
                <div class="flex items-center gap-1">
                    <button type="button" class="icon-btn"
                        @click="$store.nav.jumpToTop()"
                        :disabled="$store.nav.atTop"
                        title="Jump to top" aria-label="Jump to top">
                        <!-- arrow to a line: the extreme, not the next one along -->
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 4h14" />
                            <path d="M12 21V9" />
                            <path d="m6 15 6-6 6 6" />
                        </svg>
                    </button>
                    <button type="button" class="icon-btn"
                        @click="$store.nav.jumpToBottom()"
                        :disabled="$store.nav.atBottom"
                        title="Jump to bottom" aria-label="Jump to bottom">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 15V3" />
                            <path d="m6 9 6 6 6-6" />
                            <path d="M5 20h14" />
                        </svg>
                    </button>
                </div>

                <!-- Search Filter -->
                <div x-data="searchComponent()" class="toolbar-search ml-auto relative flex items-center">
                    <input
                        x-ref="searchInput"
                        type="text"
                        name="search"
                        x-model="query"
                        placeholder="Filter files (press / to focus)..."
                        @keyup.escape="handleEscape()"
                        class="control control-search">
                    <button
                        type="button"
                        @click="clear()"
                        x-show="isActive"
                        x-cloak
                        class="search-clear-btn"
                        aria-label="Clear search">
                        ×
                    </button>
                </div>
            </form>
        </div>

        <!-- Theme Toggle (outside form to prevent reload) -->
        <div class="flex items-center ml-3">
            <button
                type="button"
                @click="$store.theme.toggle()"
                class="icon-btn"
                title="Toggle dark/light theme">
                <span x-text="$store.theme.icon">☀️</span>
            </button>
        </div>
    </div>
</header>
